name: Publish to npm

# Publishes every @meterbility/* workspace package when a GitHub release is
# published (or manually via workflow_dispatch). Auth is npm OIDC trusted
# publishing — no NPM_TOKEN secret. Each package must have this repo +
# this workflow file registered as its trusted publisher on npmjs.com
# (Package → Settings → Trusted Publisher).

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm --provenance
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node (from .nvmrc)
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # OIDC trusted publishing needs npm >= 11.5.1; the npm bundled with
      # Node 24 can be older and silently falls back to token auth (which
      # 404s once NPM_TOKEN is gone). Upgrade HERE, not before `npm ci` —
      # upgrading the CLI ahead of install changes the native-module
      # rebuild and leaves better-sqlite3 unloadable, failing the test
      # suite. install/build/test only need the stock npm; the OIDC
      # exchange is the only thing that needs the newer one.
      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest

      # Auth is npm OIDC trusted publishing (id-token: write above) — no
      # NPM_TOKEN secret. Each @meterbility/* package has this repo +
      # workflow (publish.yml) registered as its trusted publisher on
      # npmjs.com; a missing/mistyped registration 404s that one package.
      # NOTE: OIDC cannot CREATE a package — a brand-new package's first
      # publish must be done once with user auth (npm publish from a
      # logged-in machine), then this workflow owns it from the next
      # release (learned the hard way on v0.6.4, github-copilot-adapter).
      #
      # Same topological order as the root build script. The loop is
      # RESUMABLE: a version already on the registry is skipped, not
      # failed, so a run that dies mid-loop (outage, first-publish 404)
      # can be re-dispatched and finishes the remainder. Anything else
      # still fails the job.
      - name: Publish
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          for w in packages/shared packages/spec packages/collector \
                   packages/store-postgres adapters/claude-code \
                   adapters/codex-cli adapters/cursor \
                   adapters/github-copilot packages/agent \
                   packages/proxy packages/server packages/cli; do
            name=$(node -p "require('./$w/package.json').name")
            if npm view "$name@$VERSION" version >/dev/null 2>&1; then
              echo "skip: $name@$VERSION already on the registry"
              continue
            fi
            npm publish -w "$w" --provenance --access public
          done
